# Evaluation set for the analytics assistant.
#
# Each question has:
#   numbers      numbers the answer must contain (kind: plain | share | money);
#                {any_of: [...]} accepts any one of several equivalent formulations
#                share: given as a fraction, accepted as 0.326 or 32.6 (%); money: relative tolerance
#   keywords     groups of words; the answer must contain at least one word of EACH group
#   tools        the answer is "grounded" if at least one of these tools was called
#   refuse       true when the right answer is to say the analysis does not cover it
#   reference    tool call + field that produce the expected number (checked by tests/test_evals.py,
#                so the expected answers can never drift from the results tables)

- id: q01
  type: lookup
  question: What is the median own-price elasticity of frozen pizza?
  numbers: [{value: -2.68, kind: plain, tol: 0.05, sign_insensitive: true}]
  tools: [get_category_summary]
  reference: {tool: get_category_summary, args: {category: pizza}, field: median_own_price_elasticity}

- id: q02
  type: lookup
  question: Quelle est l'élasticité-prix médiane des céréales ?
  numbers: [{value: -1.74, kind: plain, tol: 0.05, sign_insensitive: true}]
  tools: [get_category_summary]
  reference: {tool: get_category_summary, args: {category: cereal}, field: median_own_price_elasticity}

- id: q03
